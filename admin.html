<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>GIANZA — Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#111318; --bg-soft:#181b22; --card:#1d2029; --card-border:#2a2e3a;
    --accent:#ff6a1a; --accent-dim:#c65315; --text:#f3f3f1; --text-dim:#9a9ea8;
    --ok:#3fbf6f; --off:#e6484f;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
        padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  button, input, select{ font-family:inherit; }

  /* ---- login ---- */
  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-box{ background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:30px; width:100%; max-width:360px; }
  .login-box h1{ font-family:'Archivo Black',sans-serif; font-size:22px; margin:0 0 6px; }
  .login-box .tag{ color:var(--accent); }
  .login-box p{ color:var(--text-dim); font-size:13px; margin:0 0 20px; }
  .login-box input{ width:100%; background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text);
    border-radius:9px; padding:11px 13px; font-size:14px; margin-bottom:10px; }
  .login-box button{ width:100%; background:var(--accent); color:#1a0e06; border:none; border-radius:9px;
    padding:12px; font-weight:700; font-size:14px; cursor:pointer; margin-top:6px; }
  .login-box button:hover{ background:var(--accent-dim); color:#fff; }
  .login-error{ color:var(--off); font-size:13px; margin-top:10px; display:none; }

  /* ---- panel ---- */
  #panel{ display:none; }
  header{
    position:sticky; top:0; z-index:10; background:rgba(17,19,24,0.95); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--card-border);
    padding:16px 20px calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{ font-family:'Archivo Black',sans-serif; font-size:20px; margin:0; }
  header h1 .tag{ color:var(--accent); }
  .header-actions{ display:flex; gap:10px; align-items:center; }
  .btn-salir{ background:none; border:1px solid var(--card-border); color:var(--text-dim);
              border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  .btn-nuevo{ background:var(--ok); color:#06210f; border:none; border-radius:8px;
              padding:9px 16px; font-weight:700; font-size:13.5px; cursor:pointer; }

  main{ max-width:1000px; margin:0 auto; padding:20px; }

  /* ---- toolbar: buscador + filtros ---- */
  .toolbar{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .toolbar input[type="text"]{
    background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text);
    border-radius:9px; padding:11px 14px; font-size:14px; width:100%;
  }
  .filtros-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .filtros-row select{
    flex:1 1 150px; background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text);
    border-radius:9px; padding:9px 10px; font-size:13px;
  }
  .btn-limpiar-filtros{
    background:none; border:1px solid var(--card-border); color:var(--text-dim);
    border-radius:9px; padding:9px 14px; font-size:13px; cursor:pointer; flex-shrink:0;
  }

  .contador{ color:var(--text-dim); font-size:13px; margin-bottom:10px; }

  /* ---- lista estilo BoxHero ---- */
  .lista{ border:1px solid var(--card-border); border-radius:12px; overflow:hidden; }
  .fila{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:var(--card); border-bottom:1px solid var(--card-border);
    cursor:pointer; transition: background .1s ease;
  }
  .fila:last-child{ border-bottom:none; }
  .fila:hover{ background:#232732; }
  .fila img{ width:48px; height:48px; object-fit:cover; border-radius:8px; background:#0d0f14; flex-shrink:0; }
  .fila-info{ flex:1; min-width:0; }
  .fila-info .nombre{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fila-info .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .fila-right{ text-align:right; flex-shrink:0; }
  .fila-right .precio{ font-size:13.5px; font-weight:700; }
  .fila-right .precio.sin{ color:var(--text-dim); font-weight:500; font-size:12px; }
  .fila-right .stock{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .fila-right .stock.agotado{ color:var(--off); font-weight:600; }
  .chevron{ color:var(--text-dim); font-size:18px; flex-shrink:0; }

  .cat-chip{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:5px;
    background:var(--bg-soft); border:1px solid var(--card-border); color:var(--accent); font-weight:700;
    margin-left:6px; vertical-align:middle;
  }

  .empty{ text-align:center; color:var(--text-dim); padding:50px 20px; }
  .loading{ text-align:center; color:var(--text-dim); padding:50px 20px; }

  .status-msg{ font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:14px; display:none; }
  .status-msg.ok{ background:rgba(63,191,111,0.12); color:var(--ok); display:block; }
  .status-msg.error{ background:rgba(230,72,79,0.12); color:var(--off); display:block; }

  /* ---- modal de edición ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:50;
    display:none; align-items:flex-start; justify-content:center;
    padding:24px 16px; overflow-y:auto;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    width:100%; max-width:520px; padding:24px; margin-top:20px;
  }
  .modal-box h2{ font-family:'Archivo Black',sans-serif; font-size:19px; margin:0 0 18px; }
  .campo{ margin-bottom:14px; }
  .campo label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; }
  .campo input, .campo select{
    width:100%; background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text);
    border-radius:8px; padding:10px 12px; font-size:14px;
  }
  .fila-2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fila-3{ display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:10px; }

  .foto-preview{
    width:100%; aspect-ratio:1/1; max-width:120px; background:#0d0f14; border-radius:10px;
    overflow:hidden; margin-bottom:10px; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:12px;
  }
  .foto-preview img{ width:100%; height:100%; object-fit:cover; }
  .campo-foto-row{ display:flex; gap:8px; }
  .campo-foto-row input{ flex:1; }
  .btn-subir-foto{
    flex-shrink:0; background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text);
    border-radius:8px; padding:0 14px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .btn-subir-foto:hover{ border-color:var(--accent); }
  .btn-subir-foto:disabled{ opacity:0.6; cursor:wait; }

  .talles-editor label{ margin-bottom:8px; }
  .talle-row{ display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .talle-row input{ padding:8px 9px; font-size:13px; }
  .talle-row input.talle-nombre{ width:80px; flex:none; }
  .talle-row input.talle-stock{ width:80px; flex:none; }
  .talle-row button{
    background:none; border:1px solid var(--card-border); color:var(--off); border-radius:6px;
    width:30px; height:30px; cursor:pointer; font-size:14px; flex:none;
  }
  .btn-add-talle{
    background:none; border:1px dashed var(--card-border); color:var(--text-dim);
    border-radius:7px; padding:7px 14px; font-size:12.5px; cursor:pointer; margin-top:4px;
  }

  .modal-footer{ display:flex; gap:10px; margin-top:22px; }
  .btn-guardar-modal{
    flex:1; background:var(--accent); color:#1a0e06; border:none; border-radius:9px;
    padding:12px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-guardar-modal:hover{ background:var(--accent-dim); color:#fff; }
  .btn-guardar-modal.guardado{ background:var(--ok); color:#06210f; }
  .btn-borrar-modal{
    background:none; border:1px solid var(--card-border); color:var(--off); border-radius:9px;
    padding:12px 16px; font-size:14px; cursor:pointer;
  }
  .btn-cerrar-modal{
    background:none; border:1px solid var(--card-border); color:var(--text-dim); border-radius:9px;
    padding:12px 16px; font-size:14px; cursor:pointer;
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-box">
    <h1>GIANZA <span class="tag">Admin</span></h1>
    <p>Ingresá con tu usuario de administrador para gestionar el catálogo.</p>
    <input type="email" id="login-email" placeholder="Email" autocomplete="username" />
    <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password" />
    <button id="btn-login">Ingresar</button>
    <div class="login-error" id="login-error">Email o contraseña incorrectos.</div>
  </div>
</div>

<!-- ============ PANEL ============ -->
<div id="panel">
  <header>
    <h1>GIANZA <span class="tag">Admin</span></h1>
    <div class="header-actions">
      <button class="btn-nuevo" id="btn-nuevo">+ Agregar artículo</button>
      <button class="btn-salir" id="btn-salir">Salir</button>
    </div>
  </header>

  <main>
    <div class="status-msg" id="status-msg"></div>

    <div class="toolbar">
      <input type="text" id="buscador-admin" placeholder="Buscar por nombre o marca…" />
      <div class="filtros-row">
        <select id="filtro-marca"><option value="">Todas las marcas</option></select>
        <select id="filtro-categoria">
          <option value="">Todas las categorías</option>
          <option value="Adulto">Adulto</option>
          <option value="Infantil">Infantil</option>
          <option value="Ojotas">Ojotas</option>
          <option value="Nike Mind">Nike Mind</option>
        </select>
        <select id="filtro-talle"><option value="">Todos los talles</option></select>
        <button class="btn-limpiar-filtros" id="btn-limpiar-filtros">Limpiar filtros</button>
      </div>
    </div>

    <div class="contador" id="contador"></div>
    <div id="lista-productos" class="loading">Cargando productos…</div>
  </main>
</div>

<!-- ============ MODAL DE EDICIÓN / NUEVO ============ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h2 id="modal-titulo">Editar producto</h2>

    <div class="campo">
      <div class="foto-preview" id="foto-preview">Sin foto</div>
      <div class="campo-foto-row">
        <input type="text" id="campo-foto" placeholder="https://..." />
        <button type="button" class="btn-subir-foto" id="btn-subir-foto">📷 Subir desde PC</button>
        <input type="file" id="input-file-foto" accept="image/*" style="display:none;" />
      </div>
    </div>

    <div class="campo">
      <label>Nombre</label>
      <input type="text" id="campo-nombre" />
    </div>

    <div class="fila-3">
      <div class="campo">
        <label>Marca</label>
        <input type="text" id="campo-marca" />
      </div>
      <div class="campo">
        <label>Categoría</label>
        <select id="campo-categoria">
          <option value="">Sin categoría</option>
          <option value="Adulto">Adulto</option>
          <option value="Infantil">Infantil</option>
          <option value="Ojotas">Ojotas</option>
          <option value="Nike Mind">Nike Mind</option>
        </select>
      </div>
      <div class="campo">
        <label>Precio</label>
        <input type="number" min="0" id="campo-precio" />
      </div>
    </div>

    <div class="campo talles-editor">
      <label>Talles y stock</label>
      <div class="talles-rows" id="talles-rows"></div>
      <button type="button" class="btn-add-talle" id="btn-add-talle">+ Agregar talle</button>
    </div>

    <div class="modal-footer">
      <button class="btn-guardar-modal" id="btn-guardar-modal">Guardar</button>
      <button class="btn-borrar-modal" id="btn-borrar-modal">Borrar</button>
      <button class="btn-cerrar-modal" id="btn-cerrar-modal">Cancelar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://koevucbehoqfktkjjwme.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_kn4THufXr7EI9S2uA1SJyg_RUby7TQw";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let productos = [];
let idEditando = null; // null = modo "nuevo"

// ---------- login ----------
async function checkSession(){
  const { data } = await sb.auth.getSession();
  if(data.session){ mostrarPanel(); } else { mostrarLogin(); }
}
function mostrarLogin(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('panel').style.display = 'none';
}
function mostrarPanel(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  cargarProductos();
}
document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorBox = document.getElementById('login-error');
  errorBox.style.display = 'none';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errorBox.textContent = 'Email o contraseña incorrectos.'; errorBox.style.display = 'block'; return; }
  mostrarPanel();
});
document.getElementById('btn-salir').addEventListener('click', async () => {
  await sb.auth.signOut();
  mostrarLogin();
});
document.getElementById('login-password').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') document.getElementById('btn-login').click();
});

// ---------- carga de productos ----------
async function cargarProductos(){
  const cont = document.getElementById('lista-productos');
  cont.className = 'loading';
  cont.textContent = 'Cargando productos…';

  const { data, error } = await sb.from('productos').select('*').order('nombre', { ascending: true });
  if(error){ mostrarStatus('error', 'Error cargando productos: ' + error.message); cont.textContent = ''; return; }
  productos = (data || []).map(p => ({
    ...p,
    talles: p.talles || [],
    stockTotal: (p.talles || []).reduce((acc,t) => acc + (t.stock||0), 0)
  }));

  poblarFiltros();
  renderLista();
}

function mostrarStatus(tipo, texto){
  const el = document.getElementById('status-msg');
  el.className = 'status-msg ' + tipo;
  el.textContent = texto;
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

function poblarFiltros(){
  const marcas = [...new Set(productos.map(p => p.marca).filter(Boolean))].sort();
  const selMarca = document.getElementById('filtro-marca');
  const valorPrevioMarca = selMarca.value;
  selMarca.innerHTML = '<option value="">Todas las marcas</option>' +
    marcas.map(m => `<option value="${m}">${m}</option>`).join('');
  selMarca.value = valorPrevioMarca;

  const tallesSet = new Set();
  productos.forEach(p => p.talles.forEach(t => { if(t.talle) tallesSet.add(t.talle); }));
  const talles = [...tallesSet].sort((a,b) => {
    const na = parseFloat(a), nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });
  const selTalle = document.getElementById('filtro-talle');
  const valorPrevioTalle = selTalle.value;
  selTalle.innerHTML = '<option value="">Todos los talles</option>' +
    talles.map(t => `<option value="${t}">${t}</option>`).join('');
  selTalle.value = valorPrevioTalle;
}

// ---------- filtros ----------
function productosFiltrados(){
  const q = document.getElementById('buscador-admin').value.trim().toLowerCase();
  const marca = document.getElementById('filtro-marca').value;
  const categoria = document.getElementById('filtro-categoria').value;
  const talle = document.getElementById('filtro-talle').value;

  return productos.filter(p => {
    if(q && !p.nombre.toLowerCase().includes(q) && !(p.marca||'').toLowerCase().includes(q)) return false;
    if(marca && p.marca !== marca) return false;
    if(categoria && p.categoria !== categoria) return false;
    if(talle && !p.talles.some(t => t.talle === talle)) return false;
    return true;
  });
}

['buscador-admin','filtro-marca','filtro-categoria','filtro-talle'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderLista);
  document.getElementById(id).addEventListener('change', renderLista);
});
document.getElementById('btn-limpiar-filtros').addEventListener('click', () => {
  document.getElementById('buscador-admin').value = '';
  document.getElementById('filtro-marca').value = '';
  document.getElementById('filtro-categoria').value = '';
  document.getElementById('filtro-talle').value = '';
  renderLista();
});

// ---------- render de la lista ----------
function renderLista(){
  const filtrados = productosFiltrados();
  const cont = document.getElementById('lista-productos');
  document.getElementById('contador').textContent =
    `${filtrados.length} producto${filtrados.length===1?'':'s'}`;

  if(filtrados.length === 0){
    cont.className = 'empty';
    cont.textContent = 'No se encontraron productos con esos filtros.';
    return;
  }

  cont.className = 'lista';
  cont.innerHTML = filtrados.map(p => {
    const agotado = p.stockTotal === 0;
    const precioHtml = p.precio
      ? `<div class="precio">$${Number(p.precio).toLocaleString('es-AR')}</div>`
      : `<div class="precio sin">Consultar precio</div>`;
    const catChip = p.categoria ? `<span class="cat-chip">${p.categoria}</span>` : '';
    const fotoHtml = p.foto
      ? `<img src="${p.foto}" alt="" onerror="this.style.visibility='hidden'">`
      : `<div style="width:48px;height:48px;border-radius:8px;background:#0d0f14;flex-shrink:0;"></div>`;

    return `
      <div class="fila" data-id="${p.id}">
        ${fotoHtml}
        <div class="fila-info">
          <div class="nombre">${p.nombre}${catChip}</div>
          <div class="sub">${p.marca || '—'}</div>
        </div>
        <div class="fila-right">
          ${precioHtml}
          <div class="stock ${agotado ? 'agotado' : ''}">${agotado ? 'Agotado' : p.stockTotal + ' u.'}</div>
        </div>
        <div class="chevron">›</div>
      </div>
    `;
  }).join('');
}

document.getElementById('lista-productos').addEventListener('click', (e) => {
  const fila = e.target.closest('.fila');
  if(!fila) return;
  abrirModal(parseInt(fila.dataset.id, 10));
});

// ---------- modal: abrir / cerrar ----------
function abrirModal(id){
  idEditando = id;
  const p = productos.find(x => x.id === id);
  document.getElementById('modal-titulo').textContent = 'Editar producto';
  document.getElementById('campo-nombre').value = p.nombre || '';
  document.getElementById('campo-marca').value = p.marca || '';
  document.getElementById('campo-categoria').value = p.categoria || '';
  document.getElementById('campo-precio').value = p.precio || 0;
  document.getElementById('campo-foto').value = p.foto || '';
  actualizarPreviewFoto(p.foto || '');
  renderTalles(p.talles || []);
  document.getElementById('btn-borrar-modal').style.display = 'inline-block';
  document.getElementById('modal-overlay').classList.add('open');
}

function abrirModalNuevo(){
  idEditando = null;
  document.getElementById('modal-titulo').textContent = 'Nuevo producto';
  document.getElementById('campo-nombre').value = '';
  document.getElementById('campo-marca').value = '';
  document.getElementById('campo-categoria').value = '';
  document.getElementById('campo-precio').value = 0;
  document.getElementById('campo-foto').value = '';
  actualizarPreviewFoto('');
  renderTalles([{ talle:'', stock:0 }]);
  document.getElementById('btn-borrar-modal').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
}

function cerrarModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  idEditando = null;
}

document.getElementById('btn-nuevo').addEventListener('click', abrirModalNuevo);
document.getElementById('btn-cerrar-modal').addEventListener('click', cerrarModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if(e.target.id === 'modal-overlay') cerrarModal();
});

function actualizarPreviewFoto(url){
  const prev = document.getElementById('foto-preview');
  prev.innerHTML = url ? `<img src="${url}" onerror="this.parentElement.textContent='Sin foto'">` : 'Sin foto';
}
document.getElementById('campo-foto').addEventListener('input', (e) => actualizarPreviewFoto(e.target.value));

// ---------- talles dentro del modal ----------
function renderTalles(talles){
  const rows = document.getElementById('talles-rows');
  rows.innerHTML = talles.map(t => `
    <div class="talle-row">
      <input class="talle-nombre" value="${t.talle}" placeholder="Talle" />
      <input class="talle-stock" type="number" min="0" value="${t.stock}" placeholder="Stock" />
      <button type="button" class="btn-quitar-talle">&times;</button>
    </div>
  `).join('');
}
document.getElementById('btn-add-talle').addEventListener('click', () => {
  const rows = document.getElementById('talles-rows');
  const div = document.createElement('div');
  div.className = 'talle-row';
  div.innerHTML = `
    <input class="talle-nombre" placeholder="Talle" />
    <input class="talle-stock" type="number" min="0" value="0" placeholder="Stock" />
    <button type="button" class="btn-quitar-talle">&times;</button>
  `;
  rows.appendChild(div);
});
document.getElementById('talles-rows').addEventListener('click', (e) => {
  const btn = e.target.closest('.btn-quitar-talle');
  if(btn) btn.closest('.talle-row').remove();
});

// ---------- subir foto desde PC ----------
document.getElementById('btn-subir-foto').addEventListener('click', () => {
  document.getElementById('input-file-foto').click();
});
document.getElementById('input-file-foto').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const btn = document.getElementById('btn-subir-foto');
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Subiendo…';
  try{
    const extension = file.name.split('.').pop().toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    const nombreArchivo = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${extension}`;
    const { error: errorSubida } = await sb.storage.from('productos').upload(nombreArchivo, file, { cacheControl:'3600', upsert:false });
    if(errorSubida) throw errorSubida;
    const { data } = sb.storage.from('productos').getPublicUrl(nombreArchivo);
    document.getElementById('campo-foto').value = data.publicUrl;
    actualizarPreviewFoto(data.publicUrl);
    mostrarStatus('ok', 'Imagen subida. No te olvides de tocar "Guardar".');
  }catch(err){
    mostrarStatus('error', 'Error subiendo la imagen: ' + err.message);
  }finally{
    btn.disabled = false;
    btn.textContent = textoOriginal;
    e.target.value = '';
  }
});

// ---------- leer formulario del modal ----------
function leerFormularioModal(){
  const nombre = document.getElementById('campo-nombre').value.trim();
  const marca = document.getElementById('campo-marca').value.trim();
  const categoria = document.getElementById('campo-categoria').value;
  const precio = parseFloat(document.getElementById('campo-precio').value) || 0;
  const foto = document.getElementById('campo-foto').value.trim();
  const talles = [...document.querySelectorAll('#talles-rows .talle-row')].map(row => ({
    talle: row.querySelector('.talle-nombre').value.trim(),
    stock: parseInt(row.querySelector('.talle-stock').value, 10) || 0
  })).filter(t => t.talle !== '');

  return { nombre, marca, categoria: categoria || null, precio, foto, talles };
}

// ---------- guardar / borrar ----------
document.getElementById('btn-guardar-modal').addEventListener('click', async () => {
  const payload = leerFormularioModal();
  if(!payload.nombre){ mostrarStatus('error', 'El nombre no puede estar vacío.'); return; }

  const btn = document.getElementById('btn-guardar-modal');

  if(idEditando === null){
    const { error } = await sb.from('productos').insert(payload);
    if(error){ mostrarStatus('error', 'Error guardando: ' + error.message); return; }
    mostrarStatus('ok', 'Producto creado correctamente.');
  }else{
    const { error } = await sb.from('productos').update(payload).eq('id', idEditando);
    if(error){ mostrarStatus('error', 'Error guardando: ' + error.message); return; }
    mostrarStatus('ok', 'Cambios guardados.');
  }

  btn.textContent = '✓ Guardado';
  btn.classList.add('guardado');
  setTimeout(() => { btn.textContent = 'Guardar'; btn.classList.remove('guardado'); }, 900);

  await cargarProductos();
  cerrarModal();
});

document.getElementById('btn-borrar-modal').addEventListener('click', async () => {
  if(idEditando === null) return;
  if(!confirm('¿Borrar este producto del catálogo? No se puede deshacer.')) return;
  const { error } = await sb.from('productos').delete().eq('id', idEditando);
  if(error){ mostrarStatus('error', 'Error borrando: ' + error.message); return; }
  mostrarStatus('ok', 'Producto borrado.');
  await cargarProductos();
  cerrarModal();
});

checkSession();
</script>
